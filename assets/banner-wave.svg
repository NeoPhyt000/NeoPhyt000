<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Dibosh Sarker - Full Stack Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.4" stop-color="#1e3a8a"/>
      <stop offset="0.75" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="3" opacity="0.5"><animate attributeName="cy" values="90;60;90" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="300" r="2" opacity="0.4"><animate attributeName="cy" values="300;270;300" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="2.5" opacity="0.5"><animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="70" r="3" opacity="0.45"><animate attributeName="cy" values="70;45;70" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1290" cy="250" r="2" opacity="0.4"><animate attributeName="cy" values="250;280;250" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="1470" cy="110" r="3" opacity="0.5"><animate attributeName="cy" values="110;80;110" dur="7.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="150" font-family="'SF Mono', Consolas, 'Courier New', monospace" font-size="20" fill="#bae6fd" letter-spacing="4">HELLO, I'M    </text>
    <text x="800" y="228" font-size="88" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Dibosh Sarker    </text>
    <text x="800" y="282" font-size="32" font-weight="600" fill="#e0f2fe" letter-spacing="1">Full Stack Web Developer    </text>

    <!-- stack chips -->
    <g font-size="18" font-weight="600" fill="#ffffff">
      <rect x="416" y="306" width="96"  height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="464"  y="329">React</text>
      <rect x="526" y="306" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="580"  y="329">Next.js</text>
      <rect x="648" y="306" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="704"  y="329">Node.js</text>
      <rect x="774" y="306" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="849"  y="329">Tailwind CSS</text>
      <rect x="938" y="306" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="1000" y="329">MongoDB</text>
      <rect x="1076" y="306" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/><text x="1130" y="329">Python</text>
    </g>
  </g>

  <!-- animated waves (back to front) -->
  <g>
    <path d="M0,372 Q200,332 400,372 T800,372 T1200,372 T1600,372 T2000,372 T2400,372 T2800,372 T3200,372 L3200,440 L0,440 Z" fill="#ffffff" fill-opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0,392 Q200,360 400,392 T800,392 T1200,392 T1600,392 T2000,392 T2400,392 T2800,392 T3200,392 L3200,440 L0,440 Z" fill="#ffffff" fill-opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="-800 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0,412 Q200,388 400,412 T800,412 T1200,412 T1600,412 T2000,412 T2400,412 T2800,412 T3200,412 L3200,440 L0,440 Z" fill="#ffffff" fill-opacity="0.24">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
