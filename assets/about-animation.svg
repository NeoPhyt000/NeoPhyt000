  <g font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="19">
    <text x="34" y="108" clip-path="url(#c0)" xml:space="preserve"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0">&#160;developer&#160;</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#e2e8f0">&#160;{</tspan></text><text x="34" y="136" clip-path="url(#c1)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;role</tspan><tspan fill="#94a3b8">:&#160;</tspan><tspan fill="#86efac">"Full&#160;Stack&#160;Web&#160;Developer"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="34" y="164" clip-path="url(#c2)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;frontend</tspan><tspan fill="#94a3b8">:&#160;[</tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#94a3b8">,&#160;</tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#94a3b8">],</tspan></text><text x="34" y="192" clip-path="url(#c3)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;backend</tspan><tspan fill="#94a3b8">:&#160;[</tspan><tspan fill="#86efac">"Node.js"</tspan><tspan fill="#94a3b8">,&#160;</tspan><tspan fill="#86efac">"Python"</tspan><tspan fill="#94a3b8">],</tspan></text><text x="34" y="220" clip-path="url(#c4)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;styling</tspan><tspan fill="#94a3b8">:&#160;</tspan><tspan fill="#86efac">"Tailwind&#160;CSS"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="34" y="248" clip-path="url(#c5)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;database</tspan><tspan fill="#94a3b8">:&#160;</tspan><tspan fill="#86efac">"MongoDB"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="34" y="276" clip-path="url(#c6)" xml:space="preserve"><tspan fill="#7dd3fc">&#160;&#160;mindset</tspan><tspan fill="#94a3b8">:&#160;</tspan><tspan fill="#86efac">"Always&#160;improving"</tspan><tspan fill="#94a3b8">,</tspan></text><text x="34" y="304" clip-path="url(#c7)" xml:space="preserve"><tspan fill="#e2e8f0">};</tspan></text>
